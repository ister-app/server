# transcoder.yaml — HLS transcoder settings, imported by server/src/main/resources/application.yaml.
# Same conventions as core.yaml.
app:
  ister:
    transcoder:
      hls:
        # Hardware acceleration for video transcoding. Values: none, vaapi, nvdec
        hwaccel: "${HLS_HWACCEL:none}"
        # Device path used by VAAPI (ignored for nvdec/none)
        hwaccel-device: "${HLS_HWACCEL_DEVICE:/dev/dri/renderD128}"
        # Maximum number of media files that may be transcoded simultaneously
        max-concurrent-files: "${HLS_MAX_CONCURRENT_FILES:2}"
