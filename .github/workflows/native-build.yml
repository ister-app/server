# Validates the GraalVM native image on pull requests. The native build is the most
# fragile part of the toolchain (reflection/resource config), and docker-publish.yml
# only runs it after merge to main — this catches regressions before they land.
name: Native build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  native-compile:
    name: GraalVM nativeCompile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          version: '25.2.4' # GraalVM CE innovation release, jdk 25.0.4
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Native compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew nativeCompile
